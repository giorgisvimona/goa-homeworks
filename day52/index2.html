<body>
    <script>
        //2.პირობა:შექმენი პროგრამა,რომელიც ქულის მიხედვით განსაზღვრავს შეფასებას:
        //90 ზე მეტი ("A") - ფრიადი 80-89 ("B")  ძალიან ცუდი შედეგი 40 ზე ნაკლები 
        //("F") ცვლადის სახელი რაც თქვენ გაგიხარდებათ და ინფორმაცია ცვლადში იყოს 67
        let nishani = 67;

        
        if (nishani > 90) {
            console.log("A");
        } else if (nishani >= 80) {
            console.log("B");
        } else if (nishani < 40) {
            console.log("F");
        } else {
            console.log("საშუალო შედეგი");
        }
    </script>
