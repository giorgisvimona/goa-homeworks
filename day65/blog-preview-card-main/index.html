<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <style>
    body {
      background-color: hsl(47, 88%, 63%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .poto {
      background-color: hsl(0, 0%, 100%);
      max-width: 384px;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid hsl(0, 0%, 7%);
      box-shadow: 8px 8px 0 hsl(0, 0%, 7%);
    }

    .poto img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 24px;
    }

    .learning {
      background-color: hsl(47, 88%, 63%);
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 550;
      margin-bottom: 12px;
    }

    .pub {
      font-size: 14px;
      color: hsl(0, 0%, 7%);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .faundations {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 16px;
      color: hsl(0, 0%, 7%);
    }
    .text {
      font-size: 16px;
      color: hsl(0, 0%, 42%);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .avtor {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avtor img {
      width: 32px;
      height: 32px;
    }

    .avtor p {
      font-size: 14px;
      font-weight: 800;
      color: hsl(0, 0%, 7%);
    }
  </style>
</head>
<body>
  <div class="poto">
    <img src="./assets/images/illustration-article.svg" alt="illustration"/>
    <button class="learning">Learning</button>
    <p class="pub">Published 21 Dec 2023</p>
    <h1 class="faundations">HTML & CSS foundations</h1>
    <p class="text">
      These languages are the backbone of every website, defining structure,
      content, and presentation.
    </p>
    <div class="avtor">
      <img src="./assets/images/image-avatar.webp" alt="Gregito" />
      <p>Greg Hooper</p>
    </div>
  </div>
</body>
</html>
