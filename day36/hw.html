<!--
რა არის flexbox და რისთვის გამოიყენება?
Flexbox გამოიყენება ელემენტების სწორად დალაგებისთვის ერთ ხაზში 

რა ემართება მშობელი ელემენტის შვილ ელემენტებს, როცა მას flex-ს გავუწერთ?
შვილ ელემენტები ლაგდება ერთ ხაზზე

ჩამოთვალეთ ყველა ის მნიშვნელობა რაც ავხსენით justify-content-ის და ახსენით თითო რას აკეთებს
flex-start ელემენტები იწყება დასაწყისიდან ანუ მარცხნიდან
flex-end ელემენტები მიდის ბოლოსკენ ანუ მარჯვნივ
center ელემენტები განლაგდება შუაში ცენტრში
space-between ელემენტებს შორის თანაბარი სივრცეა
space-around ყველა ელემენტს გარშემო აქვს სივრცე
space-evenly ყველა სივრცე თანაბარია მათ შორისაც და ბოლოებშიც

ერთ წინადადებაში ახსენით რა განსხვავებაა flex-start-სა და center-ს შორის justify-content-ში
flex-start ელემენტებს ალაგებს დასაწყისში ხოლო center ალაგებს შუაში

ერთ წინადადებაში ახსენით რა განსხვავებაა space-between-სა და space-around-ს შორის
space-between არ ტოვებს სივრცეს ბოლოებში ხოლო space-around ტოვებს

ჩამოთვალეთ align-items-ის ყველა მნიშვნელობა და აღწერეთ რა რას აკეთებს
flex-start ელემენტები მიდის ზემოთ
flex-end ელემენტები მიდის ქვემოთ
baseline 

ახსენით რა არის flex-wrap, რა დროს გამოიყენება, რას აკეთებს და რატომ არის გამოსადეგი?
როცა ელემენტებს აღარ ყოფნით ადგილი ისინი გამოაქვს ახალ ხაზზე მაგალითად მის ქვემოთ


რა არის main axis flexbox-ში?
ის არის მთავარი ღერძი მიმართულება სადაც ელემენტები არის დალაგებული და მას აკონტროლებს justify-content

რა არის cross axis flexbox-ში?
მიმართულება რომელსაც აკონტროლებს agline-aitems

რა არის flex-direction და რას აკეთებს
flex-direction განსაზღვრავს რა მიმართულებით განლაგდეს ელემენტები flexში

რას გააკეთებს flex-direction: row?
flex-direction: row ნიშნავს რომ ელემენტები განლაგდება მარცხნიდან მარჯვნივ.

რას გააკეთებს flex-direction: column?
flex-direction: column ნიშნავს რომ ელემენტები განლაგდება ზემოდან ქვემოთ

justify-content-ში, როგორ გადავიტანოთ ელემენტები მარჯვნივ (ბოლოში)?
justify-content აკონტროლებს ელემენტების განლაგებას ჰორიზონტალურად rowს დროს და ვერტიკალურად columnის დროს

justify-content-ში, როგორ გადავიტანოთ ელემენტები მარცხნივ (თავში)?
flex-end გადააქვს ელემენტები მარჯვნივ ანუ ბოლოში
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--შექმენით flex კონტეინერი, ჩაამატეთ მასში 3 ელემენტი  და განალაგეთ ისინი ჰორიზონტალურად-->
    <div class="container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div> <br> <br> <br>
<!--შექმენით flex კონტეინერი, ჩაამატეთ მასში 5 დიდი ზომის ელემენტი, შემდეგ კი გაითვალისწინეთ ის, რომ ელემენტები ერთ ხაზზე არ იყოს მიჭუჭყული (ახალ ხაზზე გადავიდეს)
-->
<div class="container1">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
  <div class="item">5</div>
</div>
<!--შექმენით flex კონტეინერი, ჩაამატეთ მასში 3 ელემენტი, სამივე იყოს სხვადასხვა ზომის და შემდეგ მოახდინეთ ერთ ხაზზე, ანუ შუა ხაზზე
-->
<div class="container2">
  <div class="small">1</div>
  <div class="big">2</div>
  <div class="normalllllllll">3</div>
</div>


</body>
</html>
