<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--display: flex აწყობს ელემენტებს ერთად-->
    <!--flex-direction: row ელემენტები განლაგდება ჰორიზონტალურად მარცხნიდან მარჯვნივ-->
    <!--flex-direction: column ელემენტები განლაგდება ზემოდან ქვემოთ-->
    <!--justify-content: center ელემენტებს აწყობს ცენტრში-->
    <!--justify-content: space-between ელემენტებს შორის სივრცე თანაბრად ნაწილდება-->
    <!--justify-content: space-around ყველა ელემენტის ირგვლივ არის სივრცე მაგრამ კიდეებთან სივრცე ნახევარია იმიტომ რომ ყველა ელემენტს ცალ ცალკე აქვს სივრცეები და ისე ჩანს თითქოს ბოლოში ნახევარია-->
    <!-- justify-content: space-evenly ყველა ელემენტს შორის და კიდეებთანაც სივრცე ზუსტად ერთნაირია -->
    <!--align-items: center ელემენტებს აწყობს ცენტრში-->
</body>
</html>
