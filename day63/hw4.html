<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :is(.article, .sidebar) :is(button, a) {
        padding: 10px;
    }
    </style>
</head>
<body>
    <article>
        <button>buutton</button>
        <a href="">a</a>
    </article>
    <sidebar>
        <button>buutton</button>
        <a href="">a</a>
    </sidebar>
    <!-- მოცემულია სექციები .article და .sidebar. დაწერეთ სელექტორი, რომელიც ორივე ამ სექციაში მყოფ 
    button და a ელემენტებს მისცემს ერთნაირ padding-ს.-->
</body>
</html>
