<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :is(header, main, footer) p {
        color: green;
    }
    </style>
</head>
<body>
    <!-- დაწერეთ სელექტორი, რომელიც შეცვლის ტექსტის ფერს ნებისმიერ p თეგზე, 
    რომელიც მოთავსებულია header-ში, main-ში ან footer-ში. გამოიყენეთ :is(). -->
    <header>
        <p>satauri</p>
    </header>
    <main>
        <p>maini</p>
    </main>
    <footer>
        <p>footeri</p>
    </footer>
</body>
</html>
