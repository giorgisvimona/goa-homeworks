    <style>
        :is(h1, h2, h3) {
        color: blue;
    }
    </style>

<body>
    <h1>hi</h1>
    <h2>hi</h2>
    <h3>hi</h3>

    რომელიც სამივეს ერთდროულად გაალურჯებს, ისე რომ სათითაოდ ჩამოწერა არ დაგჭირდეთ. -->
</body>
