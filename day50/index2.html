<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    .container {
      display: flex;
    }

    .box {
      flex: 1;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box1 {
      background: green;
      opacity: 1;
    }

    .box2 {
      background: green;
      opacity: 0.6;
    }

    .box3 {
      background: green;
      opacity: 0.3;
    }

    .box4 {
      background:green;
      opacity: 0.1;
    }
    </style>
</head>
<body>
<div class="container">
  <div class="box box1">opacity 1</div>
  <div class="box box2">opacity 0.6</div>
  <div class="box box3">opacity 0.3</div>
  <div class="box box4">opacity 0.1</div>
</div>
</body>
</html>
