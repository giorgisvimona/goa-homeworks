<!DOCTYPE html>
<html>
<head>
<style>

.box{
    width:100px;
    height:100px;
    background:green;
    margin-top:100px;
}

</style>
</head>
<body>

<button id="plus">+10</button>
<button id="minus">-10</button>

<div class="box" id="box"></div>

<script>
let plus = document.getElementById("plus");
let minus = document.getElementById("minus");
let box = document.getElementById("box");

let position = 0;

function moveRight() {
    position += 10;
    box.style.transform = "translateX(" + position + "px)";
}

function moveLeft() {
    position -= 10;
    box.style.transform = "translateX(" + position + "px)";
}

plus.addEventListener("click", moveRight);
minus.addEventListener("click", moveLeft);
</script>

</body>
</html>
