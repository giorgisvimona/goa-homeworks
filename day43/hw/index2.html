<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .list9{
        list-style-type:disc;
    }
</style>
<style>
    .list10{
        list-style-type: inside;
    }
</style>
<style>
    .list11{
        list-style-type: square;
        color:blue
    }
</style>
<style>
    .list12{
        list-style-type: upper-alpha;
    }
</style>
<style>
    h1.curier{
        font-family: 'Roboto', sans-serif;
    }
</style>
<style>
    h1.googlefont{
        font-family:'roboto',sans-serif;

    }
</style>
<style>
    h3{
        font-family: 'Montserrat', sans-serif;
    }
</style>
<style>
    p{
        font-size:18px;
    }
</style>

</head>
<body>
    <!--
    შექმენით ul ქართული სახელებით: გიორგი, ნინო, ლევანი.
შექმენით ul, bullet-ები იყოს შიგნით (inside).
შექმენით ul, bullet-ებს მიეცით ოთხკუთხედის ფორმა და გამოიყენეთ CSS.
შექმენით ol, სადაც ნომრები იქნება დიდი ლათინური ასოებით (A, B, C).
შექმენით h1 თეგი და font: Courier New.
შექმენით h1 თეგი და დააიმპორტეთ ფონტი google font-ებიდან (ნებისმიერი).
შექმენით h2 თეგი და font: Georgia.
შექმენით h3 თეგი და გამოიყენეთ Montserrat.
შექმენით p თეგი და მისცეთ სტილი: font-size 18px
    -->
<ul class="list9">
    <li>გიორგი</li>
    <li>ნინო</li>
    <li>ლევანი</li>

</ul>
<ul class="list10">
    <li>ttt</li>
    <li>tttt</li>
    <li>ttttt</li>
</ul>
<ul class="list11">
    <li>elementebii</li>
    <li>elementebi</li>

</ul>
<ol class="list12">
    <li>gio</li>
    <li>gioo</li>
    <li>giooo</li>
</ol>
<h1 class="curier">Courier New</h1>

<h1 class="googlefont"> google font</h1>
<h3>Montserrat ფონტი</h3>
<p>ajsdnalsdnansdlansdkjbaskjhdbvaksbdamnsbdjhkasbdlasbdkasbdljasbda</p>
</body>
</html>
