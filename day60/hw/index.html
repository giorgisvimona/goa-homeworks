<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: green;
            animation-name: animacia;
            animation-duration: 3s;
        }
        @keyframes animacia{
            from{
                transform: translate(0px);
            }to{
                transform: translate(300px);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <!-- ახსენი რას აკეთებს CSS Animation და როგორ გამოიყენება @keyframes ანიმაციის შესაქმნელად.
     CSS Animation საშუალებას გაძლევს ელემენტებს მისცე მოძრაობა ფერის ცვლილება
    ზომის ცვლილება და სხვა ანიმაციები.
შექმენი ანიმაცია, რომელიც ელემენტს ნელა გადაადგილებს მარცხნიდან მარჯვნივ 3 წამში
-->
</body>
</html>
