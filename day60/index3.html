<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Site</title>

  <style>
    body {
      margin: 0px;
      padding: 0px;
    }

    header {
      background:black;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 20px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      background: green;
      color: white;
    }
    @media screen and(max-width: 480px) {
      header {
        background-color: red;
      }

      button {
        font-size: 12px;
        padding: 8px;
      }
    }
    body{
        background-color: brown;
    }
    @media screen and(max-width: 480px) {
        body{
            background-color: blue;
        }
    }
  </style>
</head>

<body>

  <header>saiti</header>
  <button>mwvane vashli</button>

</body>
</html>
