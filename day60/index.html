<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  .box {
    width: 100px;
    height: 100px;
    background-color: green;
    animation: animacia 4s infinite;
  }

  @keyframes animacia {
    0% {
      transform: translate(0, 0) scale(1);
    }
    25% {
      transform: translate(0, 200px) scale(1); 
    }
    50% {
      transform: translate(200px, 200px) scale(1); 
    }
    75% {
      transform: translate(200px, 200px) scale(2);
    }
    100% {
      transform: translate(0, 0) scale(1); 
    }
  }
</style>
</head>
<body>
    <!--შექმენით რამე ელემენტი, ჯერ ჩავიდეს ქვემოთ,
    მერე მარჯვნივ 200 პიქსელით, ზომა ორჯერ გაიზარდოს და დაუბრუნდეს საწყის პოზიციას-->
    <div class="box"></div>
</body>
</html>
