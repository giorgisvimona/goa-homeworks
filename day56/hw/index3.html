<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            padding: 40px;
            width: 100px;
            height: 100px;
            background-color: green;
            border: 2px solid black;
            transition: 0.5s all;
        }
        p:hover{
            transform: scale(1.5,1.5);
        }
        
    </style>
</head>
<body>
    <!--
    გაზარდეთ ელემენტის ზომა $1.5$-ჯერ (ორივე განზომილებაში) transform თვისების გამოყენებით.-->
    <p>hi</p>
</body>
</html>
