<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            padding: 40px;
            width: 100px;
            height: 100px;
            background-color: green;
            border: 2px solid black;
            transition: 0.5s all;
        }
        p:hover{
            transform: translate(100px,50px);
            transition: 0.5s all;
        }
    </style>
</head>
<body>
    <!--
    გამოიყენეთ transform თვისება და გადააადგილეთ ელემენტი საწყისი პოზიციიდან 
    მარჯვნივ $100px$-ით და ქვემოთ $50px$-ით.
-->
    <p>hi</p>
</body>
</html>
