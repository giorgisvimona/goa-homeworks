<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            padding: 40px;
            width: 100px;
            height: 100px;
            background-color: green;
            border: 2px solid black;
            transition: 0.5s all;
        }
        p:hover{
            transform: translateY(50px) scale(2) rotateZ(90deg);
        }
    </style>
</head>
<body>
    <!--ერთ ხაზში დაწერეთ კოდი, რომელიც ელემენტს 50px-ით გასწევს Y ღერძზე, 
    გააორმაგებს მის ზომას და  Z ღერძის გარშემო 90 გრადუსით დაატრიალებს.
    -->
    <p>hi</p>
</body>
</html>
