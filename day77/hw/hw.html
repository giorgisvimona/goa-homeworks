<!-- 1) დეტალურად ახსენით კომენტარების სახით რა განსხვავებაა პსევდო სელექტორსა და პსევდო ელემენტს შორის.
1) პსევდო სელექტორი და პსევდო ელემენტი
პსევდო სელექტორი გამოიყენება ელემენტის მდგომარეობის შესაცვლელად
მაგალითად button:hover ნიშნავს როცა მაუსი მიიტან ღილაკზე შეიცვალოს ღილაკის დიზაინი
პსევდო ელემენტი HTMLში არ არსებობს მაგრამ CSSით ვქმნით
მაგალითად p::before ტექსტის წინ ამატებს რაღაცას
2) დეტალურად ახსენით კომენტარების სახით თითოეული პსევდო ელემენტი რომელიც ამ გაკვეთილზე ვისწავლეთ (before, after, first-letter, first-line, selection, backdrop და marker)
::before ქმნის რაღაცას ელემენტის დასაწყისში
::after ქმნის რაღაცას ელემენტის ბოლოს
::first-letter ცვლის მხოლოდ პირველი ასოს სტილს
::first-line ცვლის მხოლოდ პირველ ხაზს
::selection როცა ტექსტს მონიშნავ მაუსით ცვლის მონიშნული ტექსტის დიზაინს
::markerგამოიყენება list-ის წერტილის შესაცვლელად
3) დეტალურად ახსენით კომენტარების სახით dialog თეგი, რისთვის გამოიყენება, როგორ იქმნება და ა.შ
 (ამასთან ერთად ახსენით რისთვის გამოიყენება .close() და .showModal() მეთოდები)
dialog გამოიყენება მოდალური ფანჯრის შესაქმნელად
showModal() ხსნის მოდალურ ფანჯარას
close() ხურავს ფანჯარას
