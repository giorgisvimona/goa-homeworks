<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
              color: green;
              text-decoration: none;
              transition: all 0.5s;
        }
        a:hover{
            background-color: yellow;
            color: black;
            transition: all 0.5s;
        }
        a:focus{
            background-color: black;
        }
    </style>
</head>
<body>
    
    <a href="s">link</a>
    <!--როცა რაიმეს მაგალითად ლინკს დააკლიკებ მაშინ ის ხდება focus მდგომარეობაში და აღარარი როცა სხვაგან დავაკლიკებთ-->
</body>
</html>
