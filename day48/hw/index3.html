<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            background-color: blue;
        }
        span:hover{
            background-color: green;
        }
        a:focus{
            background-color:red;
        }
        a{
            background-color: green;
            color: black;
        }
    </style>
</head>
<body>
    <!--
    რას აკეთებს :link pseudo-class?
    ლინკი ეხება მხოლოდ ლინკებს და გაქვს თუ არა ნანახი უკვე ანუ გადასული ხარ თუ არა ლინკზე  
    რა განსხვავებაა :visited-სა და :link-ს შორის
    ვიზითიდის გაწერის შემთხვევაში ჩვენ შეგვიძლია შვუცვალოთ ლიკს ფერი იმის მიხედვით უკვე გადასული ხარ თუ არა ამ ლინკზე
    განსხვავება მათ შორის რის ის რომ ლინკი ჯერ არ არის გახსნილი ლინკი 
    რომელი pseudo-class რეაგირებს მაუსის მიტანაზე (მაგალითიც წამოადგინეთ, შექმენით რაიმე ელემენტი და გასტილეთ)
    :hover  
    რა განაპირობებს ლინკის ფერის შეცვლას, როცა მას დავაკლიკებთ
    :focus
    -->
    <span>მაგალითი hover</span>
    <a href="">ssssssssssssssssssssssss</a>
</body>
</html>
