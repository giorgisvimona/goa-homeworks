<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--ჩამოსაშლელი სიისთვის გამოიყენება სელექტ თეგი-->
    <!--შექმენით იგივე ჩამოშაშლელი სია, სადაც შესაძლებელი იქნება 3 ელემენტის არჩევა (ნებისმიერი)-->
    <select>
  <option>Apple</option>
  <option>Banana</option>
  <option>Orange</option>
  <option>Grapes</option>
</select>
<!--შექმენით ჩამოშაშლელი სია, მაგრამ ამოსარჩევი ელემენტები 3 ჯგუფად დაყავით-->
<select>
  <optgroup>
    <option>Apple</option>
    <option>Banana</option>
  </optgroup>

  <optgroup>
    <option>Carrot</option>
    <option>Potato</option>
  </optgroup>

  <optgroup>
    <option>Water</option>
    <option>Juice</option>
  </optgroup>
</select>
<!--შექმენით ჩამოსაშლელი სია, სადაც პირველი ელემენტი არ იქნება default option, არამედ იყოს ცარიელი ადგილი-->
<select>
  <option selected disabled hidden></option>
  <option>Option 1</option>
  <option>Option 2</option>
</select>
<!--რისთვის გამოიყენება section
სექშენი გამოიყენება გვერდის ლოგიკურად დაყოფისთის და ჩაწერილი ელემენტების ერთმანეთისგან განცალკევებისთვის-->

</body>
</html>
