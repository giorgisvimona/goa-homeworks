<!DOCTYPE html>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0px;
        background: radial-gradient(#170225, #2e0a46);
        text-shadow: 2px 2px 5px black;
    }
    button:hover{
        box-shadow: 0px 6px 15px black;
        transform: scale(1.1);
        transition: all .5s;
    }
    h1 {
        font-size: 60px;
        color: hwb(273 14% 67%);
    }
    input {
        width: 400px;
        padding: 10px;
        font-size: 18px;
        border-radius: 20px;
        border: 1px solid #ffffff;
    }
    button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background-color: hwb(273 14% 67%);
        color: rgb(255, 255, 255);
        cursor: pointer;
    }
    .log{
        position: relative;
        bottom:160px;
        left: 630px;
    }


</style>

<input type="text" id="searchInput" placeholder="Search...">
<br>
<button onclick="search()">Search</button>

<script>
function search() {
    let query = document.getElementById("searchInput").value;
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
}
</script>
